[package]
name = "window_zones"
version = "0.1.0"
edition = "2024"
description = "Platform-neutral core for a Rectangle-style window positioning utility."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.22"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "xkb"] }
tray-item = { version = "0.10", default-features = false, features = ["ksni"] }
dbus = "0.9"
dbus-tree = "0.9"
parking_lot = "0.12"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies.rdev]
version = "0.5.3"

[target.'cfg(target_os = "windows")'.dependencies]
tray-item = { version = "0.10" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
