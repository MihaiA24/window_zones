name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        # qt6-declarative-dev-tools provides /usr/lib/qt6/bin/qmllint on Ubuntu.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config nodejs gjs qt6-declarative-dev-tools
      - name: Run maintained checks
        run: PATH="/usr/lib/qt6/bin:$PATH" bash scripts/test.sh

  # Manual Windows smoke verification is deferred; this job only proves the cfg(windows) code compiles and unit-tests.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cargo test --locked
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  # Manual macOS smoke verification is out of scope; this job only proves the cfg(target_os = "macos") code compiles and unit-tests.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cargo test --locked
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
